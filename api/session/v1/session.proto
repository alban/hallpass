// The API of a hallpass session, served on its unix socket
// ($XDG_RUNTIME_DIR/hallpass/<pid>.sock): the monitor API (see
// docs/devel/monitor.md), plus Info and Answer. Regenerate with
// `go generate ./api/session/v1`.
//
// Experimental: the goal is a stable API for clients outside this
// repository, but it may still change incompatibly.
//
// The node agent (cmd/hallpass-node) serves all the sessions of its node
// on one server: List returns them, and the other calls select one with
// the "hallpass-session" metadata (a SessionInfo.id). A session's own
// socket ignores that metadata.

syntax = "proto3";

package hallpass.session.v1;

option go_package = "github.com/alban/hallpass/api/session/v1;sessionpb";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service Session {
  // Info describes the session.
  rpc Info(InfoRequest) returns (SessionInfo);
  // Snapshot returns the pending requests and the rules; then follow
  // Events.
  rpc Snapshot(SnapshotRequest) returns (SnapshotReply);
  // Events streams the monitor's events, in batches, until the workload is
  // gone.
  rpc Events(EventsRequest) returns (stream EventBatch);
  // Apply is monitor.Apply. Errors: FAILED_PRECONDITION for ErrStale,
  // NOT_FOUND for ErrClosed, INVALID_ARGUMENT for ErrUnsupported and
  // invalid rules, PERMISSION_DENIED for the protected rules and for an
  // allow rule wider than an "always" answer could give, unless it narrows
  // an allow rule the decision removes (answer.CheckRules).
  rpc Apply(Decision) returns (ApplyReply);
  // Answer answers a pending request like the terminal prompt does, with
  // the session's policy (the folder of a grant, "never" as an exact
  // deny). NOT_FOUND if the request is no longer pending.
  rpc Answer(AnswerRequest) returns (AnswerReply);
  // List describes the sessions served; a session's own socket returns
  // just itself.
  rpc List(ListRequest) returns (ListReply);
}

message InfoRequest {}

message ListRequest {}

message ListReply {
  repeated SessionInfo sessions = 1;
}

message SessionInfo {
  int32 pid = 1;                  // the supervisor
  repeated string command = 2;
  string workdir = 3;
  string mode = 4;                // "lite" or "strict"
  google.protobuf.Timestamp start_time = 5;
  // Unanswered requests are dismissed (denied) after it; 0: never.
  google.protobuf.Duration prompt_timeout = 6;
  map<string, string> labels = 7;
  // Selects the session on a server serving several (the
  // "hallpass-session" metadata); empty on a session's own socket.
  string id = 8;
}

message SnapshotRequest {}

message SnapshotReply {
  repeated Request pending = 1;
  repeated Rule rules = 2;
  uint64 generation = 3;
}

message EventsRequest {
  bool decided = 1; // also the decided accesses
  // First send the snapshot, taken after subscribing: no event is lost
  // between the two.
  bool snapshot = 2;
}

message EventBatch {
  repeated Event events = 1;
  SnapshotReply snapshot = 2; // in the first batch, with EventsRequest.snapshot
}

message Event {
  oneof kind {
    Request opened = 1;
    Closed closed = 2;
    uint64 rules = 3; // the rule set changed: its new generation
    Decided decided = 4;
    string warning = 5;
    uint64 dropped = 6;
    // The workload gave back grants of requests it made in advance
    // (hallpass-request release): those rules are removed.
    Released released = 7;
  }
}

message Released {
  repeated Rule rules = 1;
  Subject subject = 2;
}

message Request {
  uint64 id = 1;
  string syscall = 2;
  uint32 op = 3; // rules.Op bits
  repeated Object objects = 4;
  Subject subject = 5;
  repeated Fact facts = 6;
  Prompt prompt = 7;
  // Set for a request the workload made in advance (see
  // docs/workstation/usage.md): objects[0] is the path asked for (op
  // write or exec); for network destinations (op connect and send),
  // there is no object, advance.dest says them.
  Advance advance = 8;
}

message Advance {
  bool tree = 1; // the path and everything below it
  google.protobuf.Duration for = 2; // unset: the rest of the session
  string reason = 3; // written by the workload: untrusted, display only
  string dest = 4; // network destinations, in --allow-net's syntax
  // A program (or folder of programs) the workload may write without
  // asking: a grant lets it run what it writes there.
  bool writable = 5;
}

// Prompt is what the session's terminal prompt shows about a request.
message Prompt {
  string op = 1;     // e.g. "write", "create directory"
  string path = 2;
  string exe = 3;
  uint32 pid = 4;
  repeated string cmdline = 5;
  repeated string parents = 6; // command names, nearest first
  // What the "temp" and "always" answers cover, e.g. a folder; empty:
  // only once, deny and never.
  string scope = 7;
  string never = 8;  // what "never" covers
  string warn = 9;   // e.g. "SSH keys — secret store"
  string note = 10;  // e.g. "listener started inside the sandbox"
  string detail = 11; // qualifies path, e.g. "udp" for a network address
  // A request made in advance: answered with "grant" or "deny"; path ends
  // with "/**" for a tree.
  bool advance = 12;
  string reason = 13; // written by the workload: show it as its claim
  google.protobuf.Duration grant_for = 14; // unset: the rest of the session
  // The program group the "group" answer allows, e.g. "@coreutils (cat,
  // ls, cp, … 104 programs)"; empty: no such answer.
  string group = 15;
  // The host names of a network address in path, from the workload's DNS
  // queries, e.g. "github.com": show "github.com (140.82.112.4:443)".
  // Display only: answers cover the address.
  string host_names = 16;
}

message Object {
  oneof kind {
    PathObject path = 1;
    ProcObject proc = 2;
    string unknown = 3; // why the path could not be read
    InetObject inet = 4;
    UnixObject unix = 5;
  }
}

// An IPv4 or IPv6 destination; IPv4-mapped addresses are unmapped.
message InetObject {
  uint32 proto = 1; // IP protocol number: 6 tcp, 17 udp...
  string addr = 2;  // e.g. "1.2.3.4", "2001:db8::1"
  uint32 port = 3;
  bool own_listener = 4; // loopback listener started inside the sandbox
}

// A unix socket destination: a path, or an abstract name.
message UnixObject {
  string path = 1;
  bool abstract = 2;
  string name = 3;  // abstract name, without the leading NUL
  int32 type = 4;   // SOCK_STREAM, SOCK_DGRAM, SOCK_SEQPACKET
  bool own_listener = 5;
}

message PathObject {
  string path = 1;
  uint64 dev = 2;
  uint64 ino = 3;
}

message ProcObject {
  string name = 1;
  Subject target = 2;
}

message Subject {
  repeated Task chain = 1; // the requesting thread, then its parents
}

message Task {
  int32 pid = 1;
  int32 tid = 2;
  uint64 start_time = 3;
  string comm = 4;
  string exe = 5;
  uint64 exe_dev = 6;
  uint64 exe_ino = 7;
  repeated string cmdline = 8;
  string cwd = 9;
}

enum Trust {
  TRUST_KERNEL = 0;
  TRUST_RACY = 1;
  TRUST_CLAIMED = 2;
}

message Fact {
  string kind = 1;
  string value = 2;
  Trust trust = 3;
}

message Closed {
  uint64 id = 1;
  Reason why = 2;
}

message Reason {
  string client = 1;
  uint64 rule = 2;
  string builtin = 3;
  bool died = 4;
}

enum Source {
  SOURCE_SECCOMP = 0;
  SOURCE_LSM = 1;
}

message Decided {
  google.protobuf.Timestamp time = 1;
  string syscall = 2;
  uint32 op = 3;
  repeated Object objects = 4;
  Subject subject = 5;
  bool allowed = 6;
  repeated Reason why = 7;
  Source source = 8;
}

message Decision {
  repeated Verdict verdicts = 1;
  repeated Rule add_rules = 2;
  repeated uint64 remove_rules = 3;
  repeated string remove_sets = 4;
  uint64 if_generation = 5;
  string client = 6;
  // Denies the verdicts' requests made in advance with ETIMEDOUT rather
  // than EPERM: nobody answered in time.
  bool timed_out = 7;
}

message Verdict {
  uint64 request = 1;
  bool allow = 2;
}

message ApplyReply {
  uint64 generation = 1;
}

enum RuleVerdict {
  ALLOW = 0;
  DENY = 1;
  ASK = 2;
}

message Rule {
  uint64 id = 1;
  uint32 ops = 2;
  ObjectMatch object = 3;
  RuleVerdict verdict = 4;
  string label = 5;
  google.protobuf.Timestamp expires = 6; // unset: until removed
  string set = 7;
  // The rule in the text syntax of hallpass answer add (e.g. "allow write
  // /src/**"), without its expiry; empty when the rule cannot be written
  // in it, and then cannot be edited as text (rules.Rule.Editable). Set by
  // the server, ignored in requests.
  string spec = 8;
}

message ObjectMatch {
  oneof kind {
    PathMatch path = 1;
    ProcMatch proc = 2;
    bool unknown = 3;
    InetMatch inet = 4;
    UnixMatch unix = 5;
    bool own_listener = 6; // loopback/unix listeners started inside the sandbox
    bool any_net = 7;      // every network destination, unix included
  }
}

message InetMatch {
  uint32 proto = 1;  // 0: any
  string prefix = 2; // e.g. "10.0.0.0/8"; empty: any address, any family
  uint32 port_lo = 3; // both 0: any port
  uint32 port_hi = 4;
}

message UnixMatch {
  string path = 1;
  bool abstract = 2;
  string name = 3;
  bool prefix = 4; // a tree for a path, a name prefix for an abstract name
}

message PathMatch {
  string path = 1;
  bool tree = 2;
}

message ProcMatch {
  string name = 1;
  string comm = 2;
}

message AnswerRequest {
  uint64 request = 1;
  // once, temp, always, group, deny, never; temp and always need a scope,
  // group a group. A request made in advance: grant or deny.
  string answer = 2;
  string client = 3; // reported in Reason.client
}

message AnswerReply {}
