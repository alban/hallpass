# The e2e test workloads (test/kind/e2e.sh).
apiVersion: hallpass.io/v1alpha1
kind: HallpassPolicy
metadata:
  name: e2e
spec:
  rules: |
    allow write /workspace/**
  prompt: true
  promptTimeout: 3m
---
apiVersion: v1
kind: Namespace
metadata:
  name: hallpass-e2e
  labels:
    hallpass.io/enabled: "true"
---
# Annotated, but its namespace is not selected: not mediated.
apiVersion: v1
kind: Namespace
metadata:
  name: hallpass-e2e-off
---
apiVersion: v1
kind: Pod
metadata:
  name: mediated
  namespace: hallpass-e2e
  annotations:
    hallpass.io/policy: e2e
spec:
  restartPolicy: Never
  containers:
    - name: agent
      image: BUSYBOX
      command:
        - sh
        - -c
        - |
          try() { if echo x > "$1" 2>/dev/null; then echo "$2=ok"; else echo "$2=denied"; fi; }
          try /workspace/allowed allowed
          try /etc/once once
          try /etc/denied denied
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      emptyDir: {}
---
# Selected namespace, no annotation: not mediated.
apiVersion: v1
kind: Pod
metadata:
  name: plain
  namespace: hallpass-e2e
spec:
  restartPolicy: Never
  containers:
    - name: plain
      image: BUSYBOX
      command: [sh, -c, "echo x > /etc/plain && echo plain=ok"]
---
apiVersion: v1
kind: Pod
metadata:
  name: unselected
  namespace: hallpass-e2e-off
  annotations:
    hallpass.io/policy: e2e
spec:
  restartPolicy: Never
  containers:
    - name: unselected
      image: BUSYBOX
      command: [sh, -c, "echo x > /etc/unselected && echo unselected=ok"]
---
# DNS names (hallpass-node redirects the queries to a forwarder): two
# mediated containers in one pod, glibc and musl, resolve the API server's
# name and connect to it; the prompts name the address. DNS is allowed,
# the connection asked about.
apiVersion: hallpass.io/v1alpha1
kind: HallpassPolicy
metadata:
  name: e2e-dns
spec:
  mediate: [write, connect]
  rules: |
    allow connect udp:*:53
    allow connect tcp:*:53
  prompt: true
  promptTimeout: 3m
---
apiVersion: v1
kind: Pod
metadata:
  name: dns
  namespace: hallpass-e2e
  annotations:
    hallpass.io/policy: e2e-dns
spec:
  restartPolicy: Never
  containers:
    - name: glibc
      image: BUSYBOX
      command: [sh, -c, "nc -w 5 kubernetes.default.svc.cluster.local 443 </dev/null; echo glibc=$?"]
    - name: musl
      image: ALPINE
      command: [sh, -c, "nc -w 5 kubernetes.default.svc.cluster.local 443 </dev/null; echo musl=$?"]
---
# The HTTPS proxy: GET to ghcr.io is allowed (the registry answers 401
# to an anonymous /v2/), POST is denied by hallpass (403); curl trusts
# the container's CA through the variables hallpass-node sets.
apiVersion: hallpass.io/v1alpha1
kind: HallpassPolicy
metadata:
  name: e2e-http
spec:
  mediate: [write, connect]
  rules: |
    allow connect udp:*:53
    allow connect tcp:*:53
    allow http GET https://ghcr.io/**
  prompt: false
---
apiVersion: v1
kind: Pod
metadata:
  name: https
  namespace: hallpass-e2e
  annotations:
    hallpass.io/policy: e2e-http
spec:
  restartPolicy: Never
  containers:
    - name: agent
      image: CURL
      command:
        - sh
        - -c
        - |
          echo "get=$(curl -s -o /dev/null -w '%{http_code}' https://ghcr.io/v2/)"
          echo "post=$(curl -s -X POST -w ' %{http_code}' https://ghcr.io/v2/)"
