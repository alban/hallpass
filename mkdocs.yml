site_name: hallpass
site_description: Run a program in your shell, and get asked before it writes outside your project.
site_url: https://alban.github.io/hallpass/
repo_url: https://github.com/alban/hallpass
repo_name: alban/hallpass
copyright: Apache License 2.0

theme:
  name: material
  custom_dir: website/overrides
  logo: logo.svg
  favicon: logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - content.code.copy

exclude_docs: |
  devel/

nav:
  - Home: index.md
  - Workstation:
      - workstation/index.md
      - Install: workstation/install.md
      - Getting started: workstation/getting-started.md
      - Usage: workstation/usage.md
      - Agents: workstation/agents.md
      - CLI reference: workstation/reference.md
      - Strict mode: workstation/strict.md
      - Use cases: workstation/use-cases.md
  - Kubernetes:
      - kubernetes/index.md
      - Install and operate: kubernetes/install.md
      - Opt in and policies: kubernetes/policies.md
      - Answer requests: kubernetes/answer.md
  - Answers and rules:
      - answers/index.md
      - Where to answer: answers/clients.md
      - Web UI: answers/web.md
      - Write a client: answers/api.md
  - How it works:
      - how-it-works/index.md
      - Lite mode: how-it-works/lite.md
      - Strict mode: how-it-works/strict.md
      - Files: how-it-works/files.md
      - Network: how-it-works/network.md
      - Programs: how-it-works/exec.md
      - Limitations: how-it-works/limitations.md
  - Comparison: comparison.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alban/hallpass
