# HallpassPolicy: what a pod annotated hallpass.io/policy=<name> may write
# without asking. Cluster-scoped: only the cluster admin creates policies.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hallpasspolicies.hallpass.io
spec:
  group: hallpass.io
  scope: Cluster
  names:
    kind: HallpassPolicy
    listKind: HallpassPolicyList
    plural: hallpasspolicies
    singular: hallpasspolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Ask
          type: boolean
          jsonPath: .spec.ask
        - name: Timeout
          type: string
          jsonPath: .spec.askTimeout
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                allow:
                  description: >-
                    Container paths writable without asking. "/workspace/**"
                    (or "/workspace") is the tree under /workspace.
                  type: array
                  items:
                    type: string
                    pattern: '^/[^*?\[]*(/\*\*)?$'
                deny:
                  description: >-
                    Container paths denied without asking, even under an
                    allowed tree. Same syntax as allow.
                  type: array
                  items:
                    type: string
                    pattern: '^/[^*?\[]*(/\*\*)?$'
                ask:
                  description: >-
                    Ask about writes and programs no rule decides (default
                    true). false denies them at once.
                  type: boolean
                askTimeout:
                  description: >-
                    How long a request waits for an answer before it is
                    denied (Go duration, default 5m; 0 waits forever).
                  type: string
                mediate:
                  description: >-
                    Mediated syscall categories (default files and exec).
                    network is experimental. Applies to the containers
                    created after a change.
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [files, exec, network]
                allowNetwork:
                  description: >-
                    Network destinations reached without asking: "all"
                    (every destination, unix sockets included),
                    "[tcp:|udp:]ADDR[/N][:PORT[-PORT]]" (ADDR "*" for any,
                    IPv6 in brackets), "unix:/path", "unix:/dir/**",
                    "unix:@name", "unix:@prefix*". Needs network in mediate.
                  type: array
                  items:
                    type: string
                denyNetwork:
                  description: >-
                    Network destinations denied without asking, even if
                    allowed. Same syntax as allowNetwork.
                  type: array
                  items:
                    type: string
                askNetwork:
                  description: >-
                    Network destinations asked about even inside a less
                    specific allowNetwork entry (e.g. 10.0.0.1:22 in an
                    allowed 10.0.0.0/8); a more specific allowNetwork
                    entry still allows. Same syntax as allowNetwork.
                  type: array
                  items:
                    type: string
                allowExec:
                  description: >-
                    Container programs run without asking, besides the
                    container's command (its args[0]): "/usr/bin/make" (that
                    program), "/opt/tools/**" (every program below
                    /opt/tools), or a built-in group of programs, resolved in
                    the container: "@shells", "@coreutils", "@search", "@git",
                    "@busybox", or one of groups. Needs exec in mediate.
                  type: array
                  items:
                    type: string
                    pattern: '^(/[^*?\[]*(/\*\*)?|@[a-z][a-z0-9-]*)$'
                denyExec:
                  description: >-
                    Container programs never run, even if allowed. Same
                    syntax as allowExec, without groups.
                  type: array
                  items:
                    type: string
                    pattern: '^/[^*?\[]*(/\*\*)?$'
                groups:
                  description: >-
                    Groups of container programs, by name ("@tools"): a new
                    group, or the replacement of the built-in group of the
                    same name. Programs as in denyExec. A prompt about a
                    program of a group offers the group; allowExec names
                    it. Needs exec in mediate.
                  type: object
                  maxProperties: 64
                  additionalProperties:
                    type: array
                    minItems: 1
                    items:
                      type: string
                      pattern: '^/[^*?\[]*(/\*\*)?$'
                  x-kubernetes-validations:
                    - rule: self.all(k, k.matches('^@[a-z][a-z0-9-]{0,30}$'))
                      message: >-
                        group names are @, a lowercase letter, then
                        lowercase letters, digits or -
              x-kubernetes-validations:
                - rule: >-
                    (!has(self.allowNetwork) && !has(self.denyNetwork) &&
                    !has(self.askNetwork)) ||
                    (has(self.mediate) && 'network' in self.mediate)
                  message: allowNetwork, denyNetwork and askNetwork need network in mediate
                - rule: >-
                    (!has(self.allowExec) && !has(self.denyExec) && !has(self.groups)) ||
                    !has(self.mediate) || 'exec' in self.mediate
                  message: allowExec, denyExec and groups need exec in mediate
