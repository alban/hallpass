# HallpassPolicy: what a pod annotated hallpass.io/policy=<name> may write
# without asking. Cluster-scoped: only the cluster admin creates policies.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hallpasspolicies.hallpass.io
spec:
  group: hallpass.io
  scope: Cluster
  names:
    kind: HallpassPolicy
    listKind: HallpassPolicyList
    plural: hallpasspolicies
    singular: hallpasspolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Prompt
          type: boolean
          jsonPath: .spec.prompt
        - name: Timeout
          type: string
          jsonPath: .spec.promptTimeout
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                rules:
                  description: >-
                    The policy's rules, one per line: "allow write
                    /workspace/**", "deny write /workspace/.git/**", "ask
                    write /workspace/secret", "allow exec /usr/bin/make",
                    "allow exec @git", "deny connect 169.254.169.254",
                    "allow connect tcp:*:443"... A value with a blank or
                    another character than letters, digits and
                    /._-+*~@:=%[] is quoted: "/workspace/My Documents/**".
                    # at the start of a word starts a comment; "group @name
                    /usr/bin/a /opt/b/**" defines a program group.
                    Container paths, without variables. exec rules need
                    exec in mediate, connect rules connect; the rules are
                    checked by hallpass-node, which refuses a pod naming a
                    policy with an invalid rule.
                  type: string
                  maxLength: 65536
                prompt:
                  description: >-
                    Ask about writes and programs no rule decides (default
                    true). false denies them at once.
                  type: boolean
                promptTimeout:
                  description: >-
                    How long a request waits for an answer before it is
                    denied (Go duration, default 5m; 0 waits forever).
                  type: string
                mediate:
                  description: >-
                    Mediated syscall categories (default write and exec).
                    connect is experimental. Applies to the containers
                    created after a change.
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [write, exec, connect]
                allowPaths:
                  description: Replaced by rules; refused.
                  type: array
                  items:
                    type: string
                denyPaths:
                  description: Replaced by rules; refused.
                  type: array
                  items:
                    type: string
                askPaths:
                  description: Replaced by rules; refused.
                  type: array
                  items:
                    type: string
                allowNet:
                  description: Replaced by rules; refused.
                  type: array
                  items:
                    type: string
                denyNet:
                  description: Replaced by rules; refused.
                  type: array
                  items:
                    type: string
                askNet:
                  description: Replaced by rules; refused.
                  type: array
                  items:
                    type: string
                allowExec:
                  description: Replaced by rules; refused.
                  type: array
                  items:
                    type: string
                denyExec:
                  description: Replaced by rules; refused.
                  type: array
                  items:
                    type: string
                groups:
                  description: >-
                    Groups of container programs, by name ("@tools"): a new
                    group, or the replacement of the built-in group of the
                    same name. Programs are container paths: "/usr/bin/make" or
                    "/opt/tools/**". A prompt about a program of a group
                    offers the group; "allow exec @name" in rules allows it.
                    Needs exec in mediate.
                  type: object
                  maxProperties: 64
                  additionalProperties:
                    type: array
                    minItems: 1
                    items:
                      type: string
                      pattern: '^/[^*?\[]*(/\*\*)?$'
                  x-kubernetes-validations:
                    - rule: self.all(k, k.matches('^@[a-z][a-z0-9-]{0,30}$'))
                      message: >-
                        group names are @, a lowercase letter, then
                        lowercase letters, digits or -
              x-kubernetes-validations:
                - rule: >-
                    !has(self.allowPaths) && !has(self.denyPaths) &&
                    !has(self.askPaths) && !has(self.allowNet) &&
                    !has(self.denyNet) && !has(self.askNet) &&
                    !has(self.allowExec) && !has(self.denyExec)
                  message: >-
                    allowPaths, denyPaths, askPaths, allowNet, denyNet,
                    askNet, allowExec and denyExec are replaced by rules,
                    one rule per line ("allow write /workspace/**")
                - rule: >-
                    !has(self.groups) || !has(self.mediate) || 'exec' in self.mediate
                  message: groups need exec in mediate
