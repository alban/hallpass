# The node agent: one per node. It mediates the containers through their
# seccomp listeners, which it keeps in hallpass-fd-store: restarting the
# agent keeps the running containers mediated, and their pending requests.
# While it is down, containers that opt in fail to start. Updates are
# manual (OnDelete): delete the agent pods one node at a time.
apiVersion: v1
kind: Namespace
metadata:
  name: hallpass-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hallpass-node
  namespace: hallpass-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hallpass-node
rules:
  # Namespaces for --namespace-selector. Pods are not read: NRI gives the
  # pod's annotations.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [hallpass.io]
    resources: [hallpasspolicies]
    verbs: [get, list, watch]
  # Decisions reported as Events on the pods.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hallpass-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hallpass-node
subjects:
  - kind: ServiceAccount
    name: hallpass-node
    namespace: hallpass-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hallpass-node
  namespace: hallpass-system
  labels:
    app.kubernetes.io/name: hallpass-node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hallpass-node
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hallpass-node
    spec:
      serviceAccountName: hallpass-node
      # /proc/<pid>/{mem,root,cwd,fd} of the containers of the node.
      hostPID: true
      # Not hostNetwork: the session API listens on the pod's loopback,
      # reachable through kubectl port-forward only.
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: hallpass-node
          image: ghcr.io/alban/hallpass-node:latest
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --namespace-selector=hallpass.io/enabled=true
          env:
            # The source host of the Events.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          # Ready once registered with NRI and with the namespace and
          # HallpassPolicy caches synced. No liveness probe: while the
          # agent restarts, opted-in containers fail to start.
          readinessProbe:
            exec:
              command: [/hallpass-node, ready]
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: nri
              mountPath: /var/run/nri
            - name: agent
              mountPath: /run/hallpass
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: nri
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        # The agent socket: runc, on the host, connects to the same path.
        # The fd-store socket too.
        - name: agent
          hostPath:
            path: /run/hallpass
            type: DirectoryOrCreate
---
# Keeps the node agent's seccomp listeners, and the journals of their
# notifications in flight, while the agent restarts. Without it, the
# mediated syscalls of running containers fail with ENOSYS when the agent
# restarts. Rarely updated (OnDelete): restarting it alone loses nothing,
# the agent stores its listeners again; restarting both at once does.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hallpass-fd-store
  namespace: hallpass-system
  labels:
    app.kubernetes.io/name: hallpass-fd-store
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hallpass-fd-store
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hallpass-fd-store
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: fd-store
          image: ghcr.io/alban/hallpass-node:latest
          imagePullPolicy: IfNotPresent
          args: [fd-store]
          # Root, as the owner of /run/hallpass and the only peer it
          # accepts; no capability.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: run
              mountPath: /run/hallpass
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
      volumes:
        - name: run
          hostPath:
            path: /run/hallpass
            type: DirectoryOrCreate
